# go-arch-lint configuration for art-dupl
# Enforces architectural boundaries for the code duplication detection tool
version: 3
workdir: .

allow:
  depOnAnyVendor: true
  deepScan: true

components:
  # Entry point
  main:
    in: cmd/art-dupl/**

  # CLI commands and orchestration
  cli-commands:
    in: cmd/**

  # Configuration management
  config:
    in: config/**

  # Multi-method detection coordination
  detection:
    in: detection/**

  # Core suffix tree algorithm
  suffixtree:
    in: suffixtree/**

  # AST processing and language parsers
  syntax:
    in: syntax/**

  # Hash-based detection
  hash:
    in: hash/**

  # Output formatting
  printer:
    in: printer/**

  # Public SDK
  sdk:
    in: pkg/artdupl/**

  # Domain types
  domain:
    in: domain/**

  # File parsing and tree building
  job:
    in: job/**

  # Error handling
  errors:
    in: errors/**

  # File caching
  cache:
    in: cache/**

  # Utility packages
  pkg-utils:
    in:
      - pkg/format/**
      - pkg/logger/**
      - pkg/position/**
      - internal/utils/**

  # Test utilities
  testutil:
    in:
      - internal/testutil/**
      - internal/testhelpers/**
      - internal/filtertest/**
      - internal/configtest/**

deps:
  main:
    anyProjectDeps: true

  cli-commands:
    mayDependOn:
      - config
      - detection
      - printer
      - job
      - hash
      - suffixtree
      - syntax
      - errors
      - domain
      - cache
      - pkg-utils

  detection:
    mayDependOn:
      - suffixtree
      - hash
      - syntax
      - errors
      - pkg-utils
      - domain

  suffixtree:
    mayDependOn: []

  syntax:
    mayDependOn:
      - suffixtree
      - errors
      - pkg-utils

  hash:
    mayDependOn:
      - syntax
      - errors
      - pkg-utils

  printer:
    mayDependOn:
      - syntax
      - config
      - errors
      - pkg-utils
      - domain

  sdk:
    mayDependOn:
      - detection
      - job
      - hash
      - suffixtree
      - syntax
      - errors
      - pkg-utils
      - domain

  config:
    mayDependOn:
      - domain
      - errors

  domain:
    mayDependOn: []

  errors:
    mayDependOn: []

  job:
    mayDependOn:
      - syntax
      - suffixtree
      - cache
      - errors
      - pkg-utils

  cache:
    mayDependOn:
      - syntax
      - errors

  pkg-utils:
    mayDependOn: []

  testutil:
    anyProjectDeps: true

commonComponents:
  - errors

exclude:
  - "**/vendor/**"
  - "**/testdata/**"
  - "**/*.md"
  - "docs/**"
  - "examples/**"
  - "bdd/**"

excludeFiles:
  - ".*_test\\.go$"
  - ".*_bench_test\\.go$"
  - ".*_integration_test\\.go$"
