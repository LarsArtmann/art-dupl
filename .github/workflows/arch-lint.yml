name: Architecture Lint

# Enforces package dependency boundaries declared in .go-arch-lint.yml.
# go-arch-lint uses go/packages, which needs a Go toolchain + module cache at
# runtime, so it cannot run in the pure Nix sandbox. This workflow provides the
# Go environment go-arch-lint needs and fails CI on architectural violations.

on:
  push:
    branches: [main, master, fork]
    paths:
      - "**/*.go"
      - ".go-arch-lint.yml"
      - ".github/workflows/arch-lint.yml"
  pull_request:
    branches: [main, master, fork]
    paths:
      - "**/*.go"
      - ".go-arch-lint.yml"
      - ".github/workflows/arch-lint.yml"

jobs:
  arch-lint:
    name: Verify package boundaries
    runs-on: ubuntu-latest
    env:
      CGO_ENABLED: 0
      # go-arch-lint must be COMPILED with the same toolchain the module
      # requires (go.mod says go 1.27.1); a binary built with an older Go
      # cannot type-load the newer stdlib and dies with
      # "package ... without types".
      GOTOOLCHAIN: go1.27.1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          # Must match go.mod exactly: a wrapped toolchain switch makes
          # go-arch-lint's go/packages load stdlib types from a different
          # toolchain than the binary was built with.
          go-version: "1.27.1"

      - name: Generate templ sources
        run: |
          go install github.com/a-h/templ/cmd/templ@v0.3.1020
          templ generate

      - name: Download modules
        run: go mod download

      - name: Install go-arch-lint
        run: go install github.com/fe3dback/go-arch-lint@v1.19.0

      - name: Warm build cache for stdlib export data
        # go/packages cannot resolve types for stdlib packages that have no
        # export data in the build cache yet, which fails the check with
        # "package ... without types"; building the module first fills it.
        run: go build ./...

      - name: Run go-arch-lint
        run: go-arch-lint check
