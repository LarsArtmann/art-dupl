name: CI

on:
  push:
    branches: [main, master, fork]
  pull_request:
    branches: [main, master, fork]

env:
  GOEXPERIMENT: jsonv2

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    env:
      CGO_ENABLED: 0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable

      - name: Generate templ sources
        run: |
          go install github.com/a-h/templ/cmd/templ@v0.3.1020
          templ generate

      - name: Check dependencies
        run: |
          go mod download
          go mod tidy
          git diff --exit-code go.mod go.sum

      - name: golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.13.2

  test:
    name: Test
    runs-on: ${{ matrix.os }}
    env:
      CGO_ENABLED: 0
      GOEXPERIMENT: ${{ matrix.goexperiment == 'false' && '' || 'jsonv2' }}
    strategy:
      fail-fast: false
      matrix:
        go-version: [stable]
        os: [ubuntu-latest, macos-latest, windows-latest]
        include:
          # windows/amd64 Go 1.27.1 crashes nondeterministically with fatal
          # GC/runtime errors ("found pointer to free object", "missing
          # stackmap", "fault") across unrelated test binaries — binary-
          # identical runs flip between pass and crash, and the codebase has
          # zero unsafe. Scope the jsonv2 engine experiment out of the
          # windows lane as a mitigation until upstream is fixed; ADR-0024
          # guarantees identical output bytes with or without it.
          - os: windows-latest
            goexperiment: "false"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ matrix.go-version }}

      - name: Generate templ sources
        run: |
          go install github.com/a-h/templ/cmd/templ@v0.3.1020
          templ generate

      - name: Test
        run: go test ./...

      - name: Race Test
        env:
          CGO_ENABLED: "1"
        run: go test -race ./...

      - name: Build
        run: go build ./...

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    env:
      CGO_ENABLED: 0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable

      - name: Generate templ sources
        run: |
          go install github.com/a-h/templ/cmd/templ@v0.3.1020
          templ generate

      - name: Generate Coverage
        run: |
          go test -coverprofile=coverage.out ./...
          go tool cover -func=coverage.out | grep total

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-report
          path: coverage.out

  nix:
    name: Nix Flake Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23

      - name: Check flake
        run: nix flake check

      - name: Build
        run: nix build

  self-analysis:
    name: Self-Analysis
    runs-on: ubuntu-latest
    needs: [test]
    env:
      CGO_ENABLED: 0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable

      - name: Generate templ sources
        run: |
          go install github.com/a-h/templ/cmd/templ@v0.3.1020
          templ generate

      - name: Build art-dupl
        run: go build -o dist/art-dupl ./cmd/art-dupl

      - name: Run Self-Analysis
        run: ./dist/art-dupl stats -t 50 .
