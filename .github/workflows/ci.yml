name: CI

on:
  push:
    branches: [main, master, fork]
  pull_request:
    branches: [main, master, fork]

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    env:
      CGO_ENABLED: 0
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: stable

      - uses: extractions/setup-just@v2

      - name: Check dependencies
        run: |
          go mod download
          go mod tidy
          git diff --exit-code go.mod

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v7
        with:
          version: v1.64

  test:
    name: Test
    runs-on: ${{ matrix.os }}
    env:
      CGO_ENABLED: 0
    strategy:
      fail-fast: false
      matrix:
        go-version: [oldstable, stable]
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go-version }}

      - uses: extractions/setup-just@v2

      - name: Test
        run: just test

      - name: Race Test
        run: just test-race

      - name: Build
        run: just build

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    env:
      CGO_ENABLED: 0
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: stable

      - name: Generate Coverage
        run: |
          go test -coverprofile=coverage.out ./...
          go tool cover -func=coverage.out | grep total

      - uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.out

  nix:
    name: Nix Flake Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: DeterminateSystems/nix-installer-action@v17

      - uses: DeterminateSystems/magic-nix-cache-action@v9

      - name: Check flake
        run: nix flake check --all-systems

      - name: Build
        run: nix build

  self-analysis:
    name: Self-Analysis
    runs-on: ubuntu-latest
    needs: [test]
    env:
      CGO_ENABLED: 0
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: stable

      - uses: extractions/setup-just@v2

      - name: Build art-dupl
        run: just build

      - name: Run Self-Analysis
        run: ./dist/art-dupl stats -t 50 .
