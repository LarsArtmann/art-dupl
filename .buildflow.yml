# BuildFlow project overrides — minimal, non-default information only.
# Unknown keys warn at every load; see the BuildFlow skill's canonical key list.
env:
  CGO_ENABLED: "1" # test-race requires CGO; mirrors the flake's race check
skip_steps:
  # go.mod deliberately pins the patch version (`go 1.27.1`): it aligns with
  # .golangci.yml run.go, flake.nix go_1_27, and the CI matrix, and keeps the
  # stale-shell guard hard-failing below 1.27.1. go-mod-normalize rewrites it
  # to "go 1.27" on every full run while `buildflow update` raises it back to
  # the toolchain version — the go-line flip-flop BuildFlow's own preflight
  # warns about (workspace/go-line-flipflop). Skipped until the fleet aligns
  # the go-version-auto-configure and go-mod-update dispositions upstream.
  # 2026-09-29: go-mod-normalize was NOT the only rewriter — observed live,
  # the FORMAT pipeline's go-version-auto-configure:repair step also strips
  # the patch (`go 1.27.1` → `go 1.27`) even in fast build mode, so the
  # flip-flop survived this skip. Skipped too; same upstream-alignment
  # condition.
  - go-mod-normalize
  - go-version-auto-configure
  # This repo deliberately bans exhaustruct and tagliatelle (see AGENTS.md
  # "Lint config" and scripts/check-disabled-linters.sh). The auto-configurer
  # re-adds both from its fleet defaults on every pipeline run; the guard
  # script then removes them, and the nix disabled-linters check fails in the
  # read-only sandbox whenever a re-add got committed — the chronic red-green
  # loop since 2026-09-19. The linter set here is hand-curated; config sync
  # for it is unwanted.
  - golangci-lint-auto-configure
