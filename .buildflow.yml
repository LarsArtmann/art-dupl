# BuildFlow project overrides — minimal, non-default information only.
# Unknown keys warn at every load; see the BuildFlow skill's canonical key list.
env:
  CGO_ENABLED: "1" # test-race requires CGO; mirrors the flake's race check

# go-version-auto-configure UNSKIPPED 2026-10-07: gvac v0.2.5's
# respect_patch_floor honors the deliberate `go 1.27.1` pin (aligns
# .golangci.yml run.go, flake.nix go_1_27, CI matrix) — at or below the
# installed toolchain it is reported by no rule and never stripped, so
# this side of the flip-flop is gone. go-mod-normalize stays skipped
# until its disposition aligns upstream.
tool_options:
  go-version-auto-configure:
    respect_patch_floor: true

# go-mod-normalize UNSKIPPED 2026-10-14 (W25/BF2): BOTH go-line rewriters now
# honor tool_options.go-version-auto-configure.respect_patch_floor (set above)
# — gvac since v0.2.5, go-mod-normalize since BuildFlow's 2026-10-14 plumbing —
# so the deliberate `go 1.27.1` pin survives every pipeline (verified live:
# normalize run leaves the pin byte-identical). The 2026-09/10 flip-flop war
# is over; see gvac README's rule×pin matrix.
skip_steps:
  # This repo deliberately bans exhaustruct and tagliatelle (see AGENTS.md
  # "Lint config" and scripts/check-disabled-linters.sh). The auto-configurer
  # re-adds both from its fleet defaults on every pipeline run; the guard
  # script then removes them, and the nix disabled-linters check fails in the
  # read-only sandbox whenever a re-add got committed — the chronic red-green
  # loop since 2026-09-19. The linter set here is hand-curated; config sync
  # for it is unwanted.
  - golangci-lint-auto-configure
