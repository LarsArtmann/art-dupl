version: "2"

run:
  timeout: 5m
  go: 1.26.4
  build-tags:
    - goexperiment.arenas
    - goexperiment.goroutineleakprofile
    - goexperiment.jsonv2
    - goexperiment.runtimesecret
    - goexperiment.simd
  allow-parallel-runners: true
  allow-serial-runners: true
  issues-exit-code: 1
  tests: true

output:
  formats: {}

linters:
  enable:
    # ── Bug detection ──────────────────────────────────────────────
    - bodyclose
    - contextcheck
    - copyloopvar
    - durationcheck
    - errcheck
    - errchkjson
    - errorlint
    - exhaustive
    - fatcontext
    - forcetypeassert
    - gosec
    - govet
    - ineffassign
    - nilerr
    - nilnesserr
    - nilnil
    - noctx
    - rowserrcheck
    - sqlclosecheck
    - staticcheck
    - unconvert
    - unparam
    - unused
    - wastedassign

    # ── Complexity / size ──────────────────────────────────────────
    - cyclop
    - funlen
    - gocognit
    - gocyclo
    - maintidx
    - nestif

    # ── Code quality ───────────────────────────────────────────────
    - asasalint
    - asciicheck
    - bidichk
    - canonicalheader
    - containedctx
    - decorder
    - depguard
    - dogsled
    - dupl
    - dupword
    - embeddedstructfieldcheck
    - err113
    - errname
    - exptostd
    - forbidigo
    - gocheckcompilerdirectives
    - gochecknoinits
    - gochecksumtype
    - goconst
    - gocritic
    - godot
    - godox
    - gomoddirectives
    - gomodguard_v2
    - goprintffuncname
    - gosmopolitan
    - grouper
    - iface
    - importas
    - inamedparam
    - interfacebloat
    - intrange
    - iotamixing
    - ireturn
    - loggercheck
    - makezero
    - mirror
    - misspell
    - musttag
    - nakedret
    - nolintlint
    - nonamedreturns
    - nosprintfhostport
    - prealloc
    - predeclared
    - protogetter
    - reassign
    # recvcheck disabled: false-positives on the standard Marshal(value
    # receiver) / Unmarshal(pointer receiver) pattern used by all enums.
    # - recvcheck
    - revive
    - sloglint
    - tagalign
    # tagliatelle removed: project has intentionally mixed JSON conventions
    # (SARIF spec = camelCase, SDK = snake_case, config = camelCase).
    # - tagliatelle
    - testableexamples
    - testifylint
    - testpackage
    - thelper
    - tparallel
    - unqueryvet
    - usestdlibvars
    - usetesting
    - whitespace
    - wrapcheck
    - zerologlint

    # ── Testing ────────────────────────────────────────────────────
    - ginkgolinter
    - paralleltest
    - perfsprint

    # ── Godoc ──────────────────────────────────────────────────────
    - godoclint

  settings:
    cyclop:
      max-complexity: 15
    depguard:
      rules:
        main:
          allow:
            - $gostd
            # Explicit module path instead of $module variable — the
            # variable doesn't expand reliably when go.mod has leading
            # comments. Prefix matching covers all subpackages.
            - github.com/LarsArtmann/art-dupl
            - charm.land/lipgloss/v2
            - charm.land/log/v2
            - github.com/LarsArtmann/gogenfilter
            - github.com/a-h/templ
            - github.com/aymanbagabas/go-udiff
            - github.com/charmbracelet/fang
            - github.com/charmbracelet/x/exp/golden
            - github.com/onsi/ginkgo/v2
            - github.com/onsi/gomega
            - github.com/sergi/go-diff
            - github.com/spf13/cobra
            - github.com/spf13/pflag
            - github.com/zeebo/xxh3
    dupl:
      threshold: 100
    funlen:
      lines: 80
      statements: 50
    ginkgolinter:
      forbid-focus-container: true
      forbid-spec-pollution: true
    gocognit:
      min-complexity: 35
    goconst:
      min-len: 5
      min-occurrences: 5
    gocritic:
      disabled-checks:
        - ifElseChain
    gocyclo:
      min-complexity: 15
    gomoddirectives:
      allow_replacements: true
    ireturn:
      allow:
        - anon
        - error
        - empty
        - stdlib
        - generic
        - Printer
        - Hasher
        - Detector
        - Token
    # makezero with always: false catches the actual bug (make + append)
    # while allowing the idiomatic make([]T, n) for index-fill patterns
    # (DP matrices, binary buffers, copy targets).
    makezero:
      always: false
    revive:
      rules:
        - disabled: true
          name: exported
        - disabled: true
          name: package-comments
        # var-naming: style preference, not correctness; Go stdlib stutters
        # (time.Time, sync.Mutex) and short names are idiomatic.
        - disabled: true
          name: var-naming
        # unused-parameter: Go doesn't have a convention; stdlib has many.
        - disabled: true
          name: unused-parameter
    testifylint:
      disable:
        - go-require
      enable-all: true
    wrapcheck:
      ignore-package-globs:
        - github.com/LarsArtmann/art-dupl/pkg/enum
      ignore-sigs:
        - errors.Wrap
        - errors.Wrapf
        - errors.WrapFile
        - fmt.Errorf(
        - errors.New(
        - stderrors.New(
        - domain.NewValidationError(
        - errors.HandleMarshalingError(
        - errors.WrapIO(
        # ctx.Err() is a sentinel — callers check with errors.Is, not unwrap.
        - .Err(

  exclusions:
    generated: lax
    rules:
      # ── Tests get relaxed rules (complexity, dupl, gosec, etc.) ──
      - path: _test\.go
        linters:
          - funlen
          - cyclop
          - gocognit
          - gocyclo
          - maintidx
          - dupl
          - gosec
          - err113
          - paralleltest
          - testpackage
          - forcetypeassert
          - forbidigo
          - nestif
          - wrapcheck
          - exhaustruct
          - gochecknoglobals
          - unparam
          - unused
      - path: bdd/
        linters:
          - funlen
          - cyclop
          - gocognit
          - gocyclo
          - maintidx
          - dupl
          - gosec
          - err113
          - paralleltest
          - testpackage
          - forcetypeassert
          - forbidigo
          - nestif
          - wrapcheck
          - depguard
      # ── Examples are demo code, not production quality gates ─────
      - path: examples/
        linters:
          - revive
          - varnamelen
          - mnd
          - exhaustruct
          - depguard
      # ── Test helpers are exempt from production constraints ──────
      - path: internal/testutil/
        linters:
          - revive
          - gosec
          - wrapcheck
          - depguard
          - mnd
          - godox
      # ── Printer: last-stop output layer ─────────────────────────
      # wrapcheck: wrapping fmt.Fprint/templ.Render errors adds noise to
      # user-visible output; funlen: rendering functions are legitimately
      # long (building multi-section HTML/text).
      - path: printer/
        linters:
          - wrapcheck
          - funlen
          - predeclared
      # ── cmd: Cobra command structs carry context ─────────────────
      - path: cmd/
        linters:
          - containedctx
      # ── job: orchestrator passes parse/serialize errors through ──
      - path: job/
        linters:
          - wrapcheck
      # ── Syntax/AST packages have legitimately complex switches ──
      - path: syntax/
        linters:
          - cyclop
          - gocyclo
      - path: syntax/templ/
        linters:
          - depguard
      # ── Generated templ output ───────────────────────────────────
      # (handled by global paths exclusion below)
    paths:
      - \.gen\.go$
      - _mock\.go$
      - _templ\.go$
      - vendor/

formatters:
  enable:
    - gci
    - goimports
    - gofumpt
    - golines
  settings:
    golines:
      max-len: 120
  exclusions:
    generated: lax
    paths:
      - _mock\.go$
      - _templ\.go$

issues:
  max-issues-per-linter: 50
  max-same-issues: 10
