version: "2"
run:
    timeout: 5m
    go: "1.25"
    build-tags: []
    modules-download-mode: readonly
    allow-parallel-runners: true
    allow-serial-runners: false
    issues-exit-code: 1
    tests: true
output:
    formats: {}
linters:
    enable:
        - maintidx
        - wastedassign
        - errorlint
        - grouper
        - exhaustruct
        - testpackage
        - importas
        - nolintlint
        - gosmopolitan
        - gosec
        - decorder
        - forcetypeassert
        - wrapcheck
        - tparallel
        - nonamedreturns
        - unqueryvet
        - nlreturn
        - wsl_v5
        - godot
        - noctx
        - prealloc
        - gocheckcompilerdirectives
        - nosprintfhostport
        - sqlclosecheck
        - gocritic
        - nestif
        - ginkgolinter
        - perfsprint
        - staticcheck
        - usestdlibvars
        - zerologlint
        - contextcheck
        - funcorder
        - iotamixing
        - nakedret
        - promlinter
        - paralleltest
        - whitespace
        - rowserrcheck
        - fatcontext
        - forbidigo
        - copyloopvar
        - godoclint
        - err113
        - gocyclo
        - errname
        - testifylint
        - testableexamples
        - gochecknoinits
        - containedctx
        - unconvert
        - goheader
        - ineffassign
        - goprintffuncname
        - depguard
        - modernize
        - arangolint
        - goconst
        - gomodguard
        - varnamelen
        - misspell
        - gochecksumtype
        - sloglint
        - mnd
        - exptostd
        - unused
        - tagliatelle
        - iface
        - embeddedstructfieldcheck
        - spancheck
        - recvcheck
        - inamedparam
        - interfacebloat
        - usetesting
        - gochecknoglobals
        - bodyclose
        - gocognit
        - dupword
        - nilerr
        - reassign
        - canonicalheader
        - unparam
        - exhaustive
        - govet
        - asasalint
        - makezero
        - funlen
        - mirror
        - protogetter
        - loggercheck
        - asciicheck
        - ireturn
        - intrange
        - durationcheck
        - predeclared
        - nilnesserr
        - gomoddirectives
        - errcheck
        - cyclop
        - revive
        - thelper
        - bidichk
        - tagalign
        - godox
        - nilnil
        - dogsled
        - noinlineerr
        - dupl
    settings:
        cyclop:
            max-complexity: 15
        dupl:
            threshold: 100
        funlen:
            lines: 80
            statements: 50
        gocognit:
            min-complexity: 35
        goconst:
            min-len: 5
            min-occurrences: 4
        gocyclo:
            min-complexity: 15
        ireturn:
            allow:
                - anon
                - error
                - empty
                - stdlib
                - generic
                - Printer
                - Hasher
                - Detector
                - Token
        wrapcheck:
            ignore-sigs:
                - errors.Wrap
                - errors.Wrapf
                - errors.WrapFile
                - fmt.Errorf(
                - errors.New(
                - stderrors.New(
                - domain.NewValidationError(
    exclusions:
        rules:
            - path: _test\.go
              linters:
                - funlen
                - cyclop
                - gocognit
                - gocyclo
                - maintidx
                - dupl
                - gosec
            - path: migration/
              linters:
                - typecheck
formatters:
    enable:
        - golines
issues: {}
