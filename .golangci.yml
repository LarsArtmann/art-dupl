version: "2"
run:
  timeout: 5m
  go: "1.25"
  build-tags: []
  modules-download-mode: readonly
  allow-parallel-runners: true
  allow-serial-runners: false
  issues-exit-code: 1
  tests: true
output:
  formats: {}
linters:
  enable:
    - funlen
    - interfacebloat
    - gocognit
    - perfsprint
    - nilerr
    - canonicalheader
    - maintidx
    - ineffassign
    - ireturn
    - gomoddirectives
    - makezero
    - gochecknoglobals
    - intrange
    - grouper
    - nakedret
    - exhaustive
    - goconst
    - containedctx
    - nolintlint
    - funcorder
    - errorlint
    - nosprintfhostport
    - sqlclosecheck
    - mirror
    - protogetter
    - forbidigo
    - inamedparam
    - gochecknoinits
    - gocyclo
    - wastedassign
    - rowserrcheck
    - loggercheck
    - testableexamples
    - cyclop
    - dupl
    - iface
    - asasalint
    - godot
    - ginkgolinter
    - contextcheck
    - testifylint
    - gosec
    - bodyclose
    - unconvert
    - sloglint
    - decorder
    - govet
    - dupword
    - importas
    - fatcontext
    - tagalign
    - wrapcheck
    - embeddedstructfieldcheck
    - whitespace
    - gomodguard
    - bidichk
    - spancheck
    - misspell
    - staticcheck
    - tparallel
    - thelper
    - unused
    - gochecksumtype
    - usestdlibvars
    - noctx
    - copyloopvar
    - durationcheck
    - gocritic
    - promlinter
    - goprintffuncname
    - errcheck
    - nilnesserr
    - zerologlint

  settings:
    cyclop:
      max-complexity: 15
    funlen:
      lines: 80
      statements: 50
    gocognit:
      min-complexity: 35
    gocyclo:
      min-complexity: 15
    goconst:
      min-len: 5
      min-occurrences: 4
    dupl:
      threshold: 100
    ireturn:
      allow:
        - anon
        - error
        - empty
        - stdlib
        - generic
        - Printer
        - Hasher
        - Detector
        - Token
    wrapcheck:
      ignore-sig:
        - errors.Wrap
        - errors.WrapFile

  exclusions:
    rules:
      # Exclude test files from complexity/length checks
      - path: '_test\.go'
        linters:
          - funlen
          - cyclop
          - gocognit
          - gocyclo
          - maintidx
          - dupl
          - gosec

      # Exclude migration utilities from typecheck (uses optional dependency)
      - path: 'migration/'
        linters:
          - typecheck

issues:
  # Maximum issues count per one linter
  max-issues-per-linter: 0
  # Maximum count of issues with the same text
  max-same-issues: 0
