version: "2"
run:
  timeout: 5m
  go: 1.26.4
  build-tags:
    - goexperiment.arenas
    - goexperiment.goroutineleakprofile
    - goexperiment.jsonv2
    - goexperiment.runtimesecret
    - goexperiment.simd
  allow-parallel-runners: true
  allow-serial-runners: true
  issues-exit-code: 1
  tests: true
output:
  formats: {}
linters:
  enable:
    - asasalint
    - asciicheck
    - bidichk
    - bodyclose
    - canonicalheader
    - containedctx
    - contextcheck
    - copyloopvar
    - cyclop
    - decorder
    - depguard
    - dogsled
    - dupl
    - dupword
    - durationcheck
    - embeddedstructfieldcheck
    - err113
    - errcheck
    - errchkjson
    - errname
    - errorlint
    - exhaustive
    - exhaustruct
    - exptostd
    - fatcontext
    - forbidigo
    - forcetypeassert
    - funlen
    - ginkgolinter
    - gocheckcompilerdirectives
    - gochecknoglobals
    - gochecknoinits
    - gochecksumtype
    - gocognit
    - goconst
    - gocritic
    - gocyclo
    - godoclint
    - godot
    - godox
    - gomoddirectives
    - gomodguard_v2
    - goprintffuncname
    - gosec
    - gosmopolitan
    - govet
    - grouper
    - iface
    - importas
    - inamedparam
    - ineffassign
    - interfacebloat
    - intrange
    - iotamixing
    - ireturn
    - loggercheck
    - maintidx
    - makezero
    - mirror
    - misspell
    - musttag
    - nakedret
    - nestif
    - nilerr
    - nilnesserr
    - nilnil
    - noctx
    - nolintlint
    - nonamedreturns
    - nosprintfhostport
    - paralleltest
    - perfsprint
    - prealloc
    - predeclared
    - protogetter
    - reassign
    - recvcheck
    - revive
    - rowserrcheck
    - sloglint
    - spancheck
    - sqlclosecheck
    - staticcheck
    - tagalign
    - testableexamples
    - testifylint
    - testpackage
    - thelper
    - tparallel
    - unconvert
    - unparam
    - unqueryvet
    - unused
    - usestdlibvars
    - usetesting
    - wastedassign
    - whitespace
    - wrapcheck
    - zerologlint
  settings:
    cyclop:
      max-complexity: 15
    depguard:
      rules:
        main:
          allow:
            - $gostd
            - github.com/LarsArtmann/art-dupl
            - charm.land/lipgloss/v2
            - charm.land/log/v2
            - github.com/LarsArtmann/gogenfilter
            - github.com/a-h/templ
            - github.com/aymanbagabas/go-udiff
            - github.com/charmbracelet/fang
            - github.com/charmbracelet/x/exp/golden
            - github.com/onsi/ginkgo/v2
            - github.com/onsi/gomega
            - github.com/sergi/go-diff
            - github.com/spf13/cobra
            - github.com/spf13/pflag
            - github.com/zeebo/xxh3
            - golang.org/x/sync
    dupl:
      threshold: 100
    exhaustruct:
      exclude:
        - os/exec.Cmd
    funlen:
      lines: 80
      statements: 50
    ginkgolinter:
      forbid-focus-container: true
      forbid-spec-pollution: true
    gocognit:
      min-complexity: 35
    goconst:
      min-len: 5
      min-occurrences: 5
    gocritic:
      disabled-checks:
        - ifElseChain
    gocyclo:
      min-complexity: 15
    gomoddirectives:
      allow_replacements: true
    ireturn:
      allow:
        - anon
        - error
        - empty
        - stdlib
        - generic
        - Printer
        - Hasher
        - Detector
        - Token
    makezero:
      always: false
    revive:
      rules:
        - disabled: true
          name: exported
        - disabled: true
          name: package-comments
        - disabled: true
          name: var-naming
        - disabled: true
          name: unused-parameter
    testifylint:
      disable:
        - go-require
      enable-all: true
    wrapcheck:
      ignore-package-globs:
        - github.com/LarsArtmann/art-dupl/pkg/enum
      ignore-sigs:
        - errors.Wrap
        - errors.Wrapf
        - errors.WrapFile
        - fmt.Errorf(
        - errors.New(
        - stderrors.New(
        - domain.NewValidationError(
        - errors.HandleMarshalingError(
        - errors.WrapIO(
        - .Err(
  exclusions:
    generated: lax
    rules:
      - path: _test\.go
        linters:
          - funlen
          - cyclop
          - gocognit
          - gocyclo
          - maintidx
          - dupl
          - gosec
          - err113
          - paralleltest
          - testpackage
          - forcetypeassert
          - forbidigo
          - nestif
          - wrapcheck
          - exhaustruct
          - gochecknoglobals
          - unparam
          - unused
      - path: bdd/
        linters:
          - funlen
          - cyclop
          - gocognit
          - gocyclo
          - maintidx
          - dupl
          - gosec
          - err113
          - paralleltest
          - testpackage
          - forcetypeassert
          - forbidigo
          - nestif
          - wrapcheck
          - depguard
      - path: examples/
        linters:
          - revive
          - varnamelen
          - mnd
          - exhaustruct
          - depguard
      - path: internal/testutil/
        linters:
          - revive
          - gosec
          - wrapcheck
          - depguard
          - mnd
          - godox
      - path: printer/
        linters:
          - wrapcheck
          - funlen
          - predeclared
      - path: cmd/
        linters:
          - containedctx
      - path: job/
        linters:
          - wrapcheck
      - path: syntax/
        linters:
          - cyclop
          - gocyclo
      - path: syntax/templ/
        linters:
          - depguard
      - path: _test\.go
        text: unused
        linters:
          - unused
    paths:
      - \.gen\.go$
      - _mock\.go$
      - _templ\.go$
      - config/
      - vendor/
formatters:
  enable:
    - gci
    - goimports
    - gofumpt
    - golines
  settings:
    golines:
      max-len: 120
  exclusions:
    generated: lax
    paths:
      - _mock\.go$
      - _templ\.go$
      - config/
issues:
  max-issues-per-linter: 50
  max-same-issues: 10
