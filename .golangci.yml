version: "2"
run:
    timeout: 5m
    go: 1.26.0
    build-tags:
        - goexperiment.goroutineleakprofile
        - goexperiment.jsonv2
        - goexperiment.simd
    allow-parallel-runners: true
    allow-serial-runners: true
    tests: true
output:
    formats: {}
linters:
    enable:
        - arangolint
        - asasalint
        - asciicheck
        - bidichk
        - bodyclose
        - canonicalheader
        - containedctx
        - contextcheck
        - copyloopvar
        - cyclop
        - decorder
        - depguard
        - dogsled
        - dupl
        - dupword
        - durationcheck
        - embeddedstructfieldcheck
        - err113
        - errcheck
        - errchkjson
        - errname
        - errorlint
        - exhaustive
        - exhaustruct
        - exptostd
        - fatcontext
        - forbidigo
        - forcetypeassert
        - funlen
        - ginkgolinter
        - gocheckcompilerdirectives
        - gochecknoglobals
        - gochecknoinits
        - gochecksumtype
        - gocognit
        - goconst
        - gocritic
        - gocyclo
        - godoclint
        - godot
        - godox
        - goheader
        - gomoddirectives
        - gomodguard
        - goprintffuncname
        - gosec
        - gosmopolitan
        - govet
        - grouper
        - iface
        - importas
        - inamedparam
        - ineffassign
        - interfacebloat
        - intrange
        - iotamixing
        - ireturn
        - loggercheck
        - maintidx
        - makezero
        - mirror
        - misspell
        - mnd
        - modernize
        - musttag
        - nakedret
        - nestif
        - nilerr
        - nilnesserr
        - nilnil
        - nlreturn
        - noctx
        - noinlineerr
        - nolintlint
        - nonamedreturns
        - nosprintfhostport
        - paralleltest
        - perfsprint
        - prealloc
        - predeclared
        - promlinter
        - protogetter
        - reassign
        - recvcheck
        - revive
        - rowserrcheck
        - sloglint
        - spancheck
        - sqlclosecheck
        - staticcheck
        - tagalign
        - tagliatelle
        - testableexamples
        - testifylint
        - testpackage
        - thelper
        - tparallel
        - unconvert
        - unparam
        - unqueryvet
        - unused
        - usestdlibvars
        - usetesting
        - varnamelen
        - wastedassign
        - whitespace
        - wrapcheck
        - wsl_v5
        - zerologlint
    settings:
        cyclop:
            max-complexity: 15
        dupl:
            threshold: 100
        funlen:
            lines: 80
            statements: 50
        gocognit:
            min-complexity: 35
        goconst:
            min-len: 5
            min-occurrences: 4
        gocyclo:
            min-complexity: 15
        ireturn:
            allow:
                - anon
                - error
                - empty
                - stdlib
                - generic
                - Printer
                - Hasher
                - Detector
                - Token
        wrapcheck:
            ignore-sigs:
                - errors.Wrap
                - errors.Wrapf
                - errors.WrapFile
                - fmt.Errorf(
                - errors.New(
                - stderrors.New(
                - domain.NewValidationError(
                - errors.HandleMarshalingError(
                - errors.WrapIO(
        gomoddirectives:
            allow_replacements: true
    exclusions:
        rules:
            - path: _test\.go
              linters:
                - funlen
                - cyclop
                - gocognit
                - gocyclo
                - maintidx
                - dupl
                - gosec
                - err113
                - paralleltest
                - testpackage
                - forcetypeassert
                - forbidigo
                - nestif
                - recvcheck
                - golines
            - path: bdd/
              linters:
                - funlen
                - cyclop
                - gocognit
                - gocyclo
                - maintidx
                - dupl
                - gosec
                - err113
                - paralleltest
                - testpackage
                - forcetypeassert
                - forbidigo
                - nestif
                - golines
            - path: examples/
              linters:
                - revive
            - path: testutils/
              linters:
                - revive
                - gosec
                - varnamelen
                - mnd
                - godox
            - path: bdd/
              linters:
                - wrapcheck
            - path: migration/
              linters:
                - typecheck
            - path: config/
              linters:
                - recvcheck
            - path: domain/
              linters:
                - recvcheck
            - path: syntax/
              linters:
                - varnamelen
                - gochecknoglobals
                - mnd
                - godox
                - depguard
                - exhaustruct
            - path: _test\.go
              text: dot-imports
              linters:
                - revive
            - path: bdd/
              text: dot-imports
              linters:
                - revive
            - path: migration/
